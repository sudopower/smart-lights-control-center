[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "light-sync"
version = "0.1.0"
description = "Sync Govee LED lights to video and music"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "aiohttp>=3.9.0",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",
]

[project.scripts]
lightsync = "lightsync.dashboard.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lightsync"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["e2e: end-to-end tests requiring a real device"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
